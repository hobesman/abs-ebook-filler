<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Ebook Filler{% endblock %}</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.3" defer></script>
</head>
<body>
  {% set path = request.url.path %}
  <header class="container-fluid topbar" id="topbar">
    <nav>
      <ul><li><strong>📚 Ebook Filler</strong></li></ul>
      <ul>
        <li><a href="/" {% if path == "/" %}aria-current="page"{% endif %}>Books</a></li>
        <li><a href="/activity" {% if path.startswith("/activity") %}aria-current="page"{% endif %}>Activity{% if paused %}
          <span class="paused-badge" title="Processing paused, resumes in {{ pause_left }}">⏸</span>{% endif %}</a></li>
        <li><a href="/settings" {% if path.startswith("/settings") %}aria-current="page"{% endif %}>Settings</a></li>
      </ul>
    </nav>
    {% block topbar_extra %}{% endblock %}
  </header>
  <main class="container-fluid">
    {% block content %}{% endblock %}
  </main>
  <dialog id="lightbox" aria-label="Cover image">
    <img alt="Cover (full size)">
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  {% block scripts %}{% endblock %}
  <script src="/static/app.js" defer></script>
</body>
</html>
