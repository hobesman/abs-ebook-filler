[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "abs-ebook-filler"
version = "0.1.0"
description = "Find Audiobookshelf audiobooks without an ebook, fetch EPUBs via Shelfmark, and drop them next to the audio files."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "rapidfuzz>=3.6",
    "pydantic-settings>=2.2",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "respx>=0.21"]

[project.scripts]
abs-ebook-filler = "abs_ebook_filler.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/abs_ebook_filler"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
